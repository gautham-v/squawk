[workspace]
resolver = "2"
members = ["crates/squawk-core", "crates/squawk-engine", "crates/squawk-app", "crates/squawk-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/gautham-v/squawk"
authors = ["Gautham Vemulapalli"]

[workspace.dependencies]
squawk-core = { path = "crates/squawk-core" }
squawk-engine = { path = "crates/squawk-engine" }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
log = "0.4"
libc = "0.2"

[profile.release]
opt-level = 3
