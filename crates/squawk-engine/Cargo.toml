[package]
name = "squawk-engine"
description = "Mic and system audio capture, Parakeet speech-to-text, streaming dictation and meeting recording for squawk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Run Parakeet through ONNX Runtime's CoreML execution provider. Off by
# default: int8 on the M-series CPU is already well past real time, and
# CoreML's first-load compile is slow.
coreml = ["transcribe-rs/ort-coreml"]

[dependencies]
squawk-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
log.workspace = true

# speech to text: NVIDIA Parakeet TDT 0.6B v3 (int8 ONNX)
transcribe-rs = { version = "0.3.11", features = ["onnx"] }

# audio
cpal = "0.18"
hound = "3.5"
screencapturekit = { version = "11", features = ["macos_15_0"] }

# threads
crossbeam-channel = "0.5"

# one-time model download
ureq = "3"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
